name: Farplay Windows x64

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win_x64:
    name: Build Farplay win_x64 (VC)
    runs-on: windows-latest
    env:
      CC: clang-cl.exe
      CXX: clang-cl.exe
      VULKAN_SDK: C:\VulkanSDK\
      triplet: x64-windows
      # vcpkg 2026.10.16 (l'ancien commit upstream télécharge des paquets MSYS2 disparus).
      vcpkg_baseline: 5d4a3dc90c0b3773f3bac81bf41297b54328f471
      dep_folder: deps
      libplacebo_tag: v7.387.0
      sdl2_compat_tag: 2.32.74
      # Pinned (upstream used LunarG "latest.json"); matches the SPIRV-Cross tag below.
      vulkan_sdk_version: 1.4.363.1
      # Pinned (upstream cloned the default branch).
      spirv_cross_ref: vulkan-sdk-1.4.363.0
      # NOTE: upstream pulls this from the floating "latest" release tag of
      # streetpea/FFmpeg-Builds; no concrete tag could be verified, so it is kept as-is.
      # The deps cache below is keyed on ffmpeg_asset only, bump cache_rev to force a refresh.
      ffmpeg_asset: ffmpeg-n9.0-latest-win64-gpl-shared-9.0
      cache_rev: "1"
      # CMake 4 du runner refuse les vieux ports vcpkg (json-c : cmake_minimum_required < 3.5).
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
      VCPKG_KEEP_ENV_VARS: CMAKE_POLICY_VERSION_MINIMUM
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-bincache

    defaults:
      run:
        shell: powershell

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Compute short SHA
        run: |
          $short = "${{ github.sha }}".Substring(0,8)
          echo "SHORT_SHA=$short" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set vcpkg installed dir
        run: |
          echo "VCPKG_INSTALLED_DIR=${{ github.workspace }}\build\vcpkg_installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Vulkan
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $ver = "${{ env.vulkan_sdk_version }}"
          echo Version $ver
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe" -OutFile VulkanSDK.exe
          echo Downloaded
          .\VulkanSDK.exe --root ${{ env.VULKAN_SDK }}  --accept-licenses --default-answer --confirm-command install

      - name: Set up Ninja
        run: choco install ninja

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v2
        with:
          version: 18

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          # Épinglé : depuis Qt 6.11 le dépôt Qt a changé de structure et aqtinstall 3.3
          # ne trouve plus les paquets (« Failed to locate XML data »). Remonter quand aqt suit.
          version: "6.10.3"
          host: 'windows'
          target: 'desktop'
          modules: 'qtwebengine qtpositioning qtwebchannel qtwebsockets qtserialport'

      - name: Install pip dependencies
        run: |
          ${{ env.pythonLocation }}\python.exe -m pip install --upgrade pip
          ${{ env.pythonLocation }}\python.exe -m pip install --upgrade setuptools wheel
          ${{ env.pythonLocation }}\python.exe -m pip install --user --upgrade scons protobuf grpcio-tools pyinstaller
          ${{ env.pythonLocation }}\python.exe -m pip install --user --upgrade meson
          ${{ env.pythonLocation }}\python.exe -c 'import google.protobuf; print(google.protobuf.__file__)'

      - name: Cache FFmpeg/SDL2/SPIRV-Cross/shaderc/libplacebo deps
        id: deps-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.dep_folder }}
          key: deps-win64-${{ env.cache_rev }}-${{ env.ffmpeg_asset }}-sdl2c${{ env.sdl2_compat_tag }}-spirv${{ env.spirv_cross_ref }}-vk${{ env.vulkan_sdk_version }}-plbo${{ env.libplacebo_tag }}-vcpkg${{ env.vcpkg_baseline }}

      - name: Setup ffmpeg
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri "https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/${{ env.ffmpeg_asset }}.zip" -OutFile ".\${{ env.ffmpeg_asset }}.zip"
          Expand-Archive -LiteralPath "${{ env.ffmpeg_asset }}.zip" -DestinationPath "."
          Rename-Item "${{ env.ffmpeg_asset }}" "${{ env.dep_folder }}"

      - name: Setup sdl2-compat
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -UseBasicParsing -Uri https://github.com/libsdl-org/sdl2-compat/releases/download/release-${{ env.sdl2_compat_tag }}/sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip -OutFile sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip
          Expand-Archive -Force -LiteralPath "sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64.zip" -DestinationPath ".\sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64"
          Get-ChildItem -Path ".\sdl2-compat-${{ env.sdl2_compat_tag }}-win32-x64\*" -Include "*.dll" | Copy-Item -Force -Destination "${{ env.dep_folder }}\bin"

      - name: Build SPIRV-Cross
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/KhronosGroup/SPIRV-Cross.git
          cd SPIRV-Cross
          git checkout ${{ env.spirv_cross_ref }}
          cmake `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}\${{ env.dep_folder }}" `
          -DSPIRV_CROSS_SHARED=ON `
          -S . `
          -B build `
          -G Ninja
          cmake --build build --config Release
          cmake --install build

      # shaderc vient du Vulkan SDK (version épinglée) : l'ancien lien « badge » de Google n'existe plus.
      - name: Setup shaderc
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          $sdk = "${{ env.VULKAN_SDK }}".TrimEnd('\').Replace('\', '/')
          $dep = "${{ github.workspace }}\${{ env.dep_folder }}"
          New-Item -ItemType Directory -Force -Path "$dep\bin", "$dep\lib\pkgconfig" | Out-Null
          cp "${{ env.VULKAN_SDK }}Bin\shaderc_shared.dll" "$dep\bin" -Force
          @(
            "prefix=$sdk",
            'includedir=${prefix}/Include',
            'libdir=${prefix}/Lib',
            '',
            'Name: shaderc',
            'Description: shaderc (Vulkan SDK ${{ env.vulkan_sdk_version }})',
            'Version: 2025.1',
            'Libs: -L${libdir} -lshaderc_shared',
            'Cflags: -I${includedir}'
          ) | Set-Content -Encoding ascii "$dep\lib\pkgconfig\shaderc.pc"
          Get-Content "$dep\lib\pkgconfig\shaderc.pc"

      - name: Make build directory
        run: |
          mkdir build

      # restore/save séparés : le cache est sauvé dès qu'il est produit, même si la suite échoue.
      - name: Cache vcpkg binary archives
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-bin-${{ env.triplet }}-${{ env.vcpkg_baseline }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bin-${{ env.triplet }}-${{ env.vcpkg_baseline }}-

      - name: Create vcpkg binary cache dir
        run: New-Item -ItemType Directory -Force -Path "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" | Out-Null

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.vcpkg_baseline }}
          runVcpkgInstall: true
          vcpkgJsonGlob: "vcpkg.json"
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ env.VCPKG_DEFAULT_BINARY_CACHE }},readwrite"

      - name: Save vcpkg binary archives
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-bin-${{ env.triplet }}-${{ env.vcpkg_baseline }}-${{ hashFiles('vcpkg.json') }}

      - name: Build libplacebo
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          git clone --recursive https://github.com/haasn/libplacebo.git
          cd libplacebo
          git checkout --recurse-submodules ${{ env.libplacebo_tag }}
          meson setup `
          --prefix "${{ github.workspace }}\${{ env.dep_folder }}" `
          --native-file ../meson.ini `
          "--pkg-config-path=['${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\lib\pkgconfig','${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\share\pkgconfig','${{ github.workspace }}\${{ env.dep_folder }}\lib\pkgconfig']" `
          "--cmake-prefix-path=['${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}', '${{ env.VULKAN_SDK }}', '${{ github.workspace }}\${{ env.dep_folder }}']" `
          -Dc_args="/I ${{ env.VULKAN_SDK }}Include" `
          -Dcpp_args="/I ${{ env.VULKAN_SDK }}Include" `
          -Dc_link_args="/LIBPATH:${{ env.VULKAN_SDK }}Lib" `
          -Dcpp_link_args="/LIBPATH:${{ env.VULKAN_SDK }}Lib" `
          -Ddemos=false `
          ./build
          ninja -C./build
          ninja -C./build install

      - name: Save deps cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.dep_folder }}
          key: deps-win64-${{ env.cache_rev }}-${{ env.ffmpeg_asset }}-sdl2c${{ env.sdl2_compat_tag }}-spirv${{ env.spirv_cross_ref }}-vk${{ env.vulkan_sdk_version }}-plbo${{ env.libplacebo_tag }}-vcpkg${{ env.vcpkg_baseline }}

      - name: Apply Patches
        run: |
          git apply --ignore-whitespace --verbose --directory=third-party/gf-complete/ scripts/windows-vc/gf-complete.patch

      - name: Configure Farplay
        run: |
          cmake `
          -S . `
          -B build `
          -G Ninja `
          -DCMAKE_TOOLCHAIN_FILE:STRING="vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE `
          -DCMAKE_BUILD_TYPE=Release `
          -DCHIAKI_ENABLE_CLI=OFF `
          -DCHIAKI_GUI_ENABLE_SDL_GAMECONTROLLER=ON `
          -DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF `
          -DPYTHON_EXECUTABLE="${{ env.pythonLocation }}\python.exe" `
          -DFARPLAY_GIT_HASH="${{ env.SHORT_SHA }}" `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}\${{ env.dep_folder }};${{ env.VULKAN_SDK }}"

      - name: Build Farplay
        run: |
          cmake --build build --config Release --clean-first --target chiaki

      - name: Prepare Qt deployment package
        run: |
          mkdir Farplay-Win
          cp build\gui\farplay.exe Farplay-Win
          cp build\third-party\cpp-steam-tools\cpp-steam-tools.dll Farplay-Win
          cp scripts\qtwebengine_import.qml gui\src\qml\
          # Toutes les DLL vcpkg (la liste upstream citait hidapi/fftw3, absents du manifeste).
          cp "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\*.dll" Farplay-Win
          foreach ($sdl in "SDL2.dll", "SDL3.dll") { $p = "${{ github.workspace }}\${{ env.dep_folder }}\bin\$sdl"; if (Test-Path $p) { cp $p Farplay-Win } }
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\swresample-*.dll" Farplay-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\avcodec-*.dll" Farplay-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\avutil-*.dll" Farplay-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\avformat-*.dll" Farplay-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\libplacebo-*.dll" Farplay-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\shaderc_shared.dll" Farplay-Win
          cp "${{ github.workspace }}\${{ env.dep_folder }}\bin\spirv-cross-c-shared.dll" Farplay-Win
          windeployqt.exe --no-translations --qmldir=gui\src\qml --release Farplay-Win\farplay.exe

      - name: Package Farplay
        run: |
          $RELEASE_PACKAGE_FILE = "farplay-win64-${{ env.SHORT_SHA }}.zip"
          Compress-Archive Farplay-Win $RELEASE_PACKAGE_FILE
          $release_filepath = Get-ChildItem $RELEASE_PACKAGE_FILE | %{$_[0].FullName}
          echo "RELEASE_PACKAGE_PATH=$release_filepath" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Farplay Artifact
        uses: actions/upload-artifact@v7
        with:
          name: farplay-win64-${{ env.SHORT_SHA }}
          path: ${{ env.RELEASE_PACKAGE_PATH }}
          if-no-files-found: error
          retention-days: 7
